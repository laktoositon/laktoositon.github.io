<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ribbon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" /> <!-- Indigo-500 -->
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" /> <!-- Purple-500 -->
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" /> <!-- Pink-500 -->
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)">
    <!-- Top Horizontal Segment -->
    <path d="M15 20 H85 L75 35 H25 L15 20 Z" fill="url(#ribbon-gradient)" opacity="0.9" />
    
    <!-- Diagonal Segment (The main body) -->
    <path d="M75 35 L25 75 L35 90 L85 50 L75 35 Z" fill="url(#ribbon-gradient)" />
    
    <!-- Bottom Horizontal Segment -->
    <path d="M25 75 H85 L95 90 H35 L25 75 Z" fill="url(#ribbon-gradient)" opacity="0.9" />
  </g>
</svg>
